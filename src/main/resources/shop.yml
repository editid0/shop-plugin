# SimpleShop items & categories
#
# Each category:
#   name:  display name (MiniMessage)
#   icon:  material shown in the main menu
#   slot:  slot in the main menu (0-based; leave out to auto-place)
#   items: MATERIAL: { buy: <price per item>, sell: <price per item> }
#          Leave out 'buy' (or set it to 0) to make an item sell-only, and the same for 'sell'.
#
# Optional per-item settings:
#   dynamic: false        never change this item's price (see dynamic-pricing in config.yml)
#   volume: 500           net units sold for the price to halve (overrides money-volume)
#   max-amount: 64        most that can be bought in one transaction
#   permission: some.perm required to buy
#
# Command items run console commands instead of giving an item. The key is any unique id:
#   vip_rank:
#     material: DIAMOND_CHESTPLATE      # icon
#     name: "<aqua>VIP Rank"
#     lore: [ "<gray>Unlocks /kit vip" ]
#     buy: 50000
#     max-amount: 1                     # 1 = fixed single purchase, >1 shows the amount picker
#     commands:                         # placeholders: {player} {uuid} {amount}
#       - "lp user {player} parent add vip"
#
# Default prices are per single item. Sell prices are ~25-35% of buy prices, and crafted/smelted
# items are priced so players can't profit by buying ingredients and selling the result.
# Unknown material names are skipped with a warning in the console.

